<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ScrollStamp</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-container">
    <header class="popup-header">
      <div class="header-brand">
        <span class="header-logo">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="color: #ff4a4a; display: block;">
            <path d="M12 17v5"></path>
            <path d="M9 10.76a2 2 0 0 1-1.11 1.79l-1.78.89A.5.5 0 0 0 6.36 14h11.28a.5.5 0 0 0 .25-.56l-1.78-.89A2 2 0 0 1 15 10.76V6h-6v4.76z"></path>
            <path d="M15 6V3a1 1 0 0 0-1-1h-4a1 1 0 0 0-1 1v3"></path>
          </svg>
        </span>
        <span class="header-title">ScrollStamp</span>
        <span class="version">v2.2</span>
      </div>
      <span id="mode-badge" class="mode-badge">—</span>
    </header>

    <div id="site-control" class="site-control">
      <span id="site-hostname" class="site-hostname" title="Current site">—</span>
      <button id="site-toggle" class="site-toggle" role="switch" aria-checked="true" aria-label="Enable or disable ScrollStamp on this site">
        <span class="site-toggle-knob"></span>
      </button>
    </div>

    <div id="stamps-container">
      <div id="empty-state" class="empty-state">
        <div class="empty-icon" style="color: #ff4a4a; opacity: 0.35;">
          <svg viewBox="0 0 24 24" width="48" height="48" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="display: block; margin: 0 auto;">
            <path d="M12 17v5"></path>
            <path d="M9 10.76a2 2 0 0 1-1.11 1.79l-1.78.89A.5.5 0 0 0 6.36 14h11.28a.5.5 0 0 0 .25-.56l-1.78-.89A2 2 0 0 1 15 10.76V6h-6v4.76z"></path>
            <path d="M15 6V3a1 1 0 0 0-1-1h-4a1 1 0 0 0-1 1v3"></path>
          </svg>
        </div>
        <p class="empty-title">No bookmarks yet</p>
        <span id="empty-hint" class="empty-hint">Select text on any page to bookmark it</span>
      </div>
      <ul id="stamps-list"></ul>
    </div>

    <footer class="popup-footer">
      <button id="clear-all" class="btn-clear" title="Delete all bookmarks">
        🗑 Clear All
      </button>
      <a href="https://github.com/SathwikPerla/ScrollStamp" target="_blank" class="github-link" title="Star on GitHub">
        ⭐ Star
      </a>
    </footer>
  </div>
  <script src="popup.js"></script>
</body>
</html>
